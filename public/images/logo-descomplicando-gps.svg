    <!-- LETTER P -->
    <path d="M 148 10 L 225 10 C 255 10 268 28 268 55 C 268 82 252 98 222 98 L 176 98 L 176 140 L 148 140 Z" fill="#182e02" transform="translate(4, 6)" />
    <path d="M 148 10 L 225 10 C 255 10 268 28 268 55 C 268 82 252 98 222 98 L 176 98 L 176 140 L 148 140 Z" fill="url(#gpsLimeGrad)" stroke="#1c3302" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 176 28 L 218 28 C 236 28 244 38 244 54 C 244 70 236 80 218 80 L 176 80 Z" fill="#090d0b" stroke="#1c3302" stroke-width="2.5" />
    <path d="M 151 13 L 223 13 C 250 13 264 29 264 54" stroke="url(#bevelLight)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- LETTER S -->
    <path d="M 288 38 L 380 38 L 380 54 L 316 54 C 300 54 292 62 292 74 C 292 86 304 94 324 94 L 368 94 C 392 94 404 108 404 124 C 404 140 388 140 368 140 L 278 140 L 278 124 L 364 124 C 376 124 380 120 380 114 C 380 108 372 106 356 106 L 312 106 C 284 106 270 94 270 74 C 270 48 282 38 308 38 Z" fill="#182e02" transform="translate(4, 6)" />
    <path d="M 288 38 L 388 38 L 388 54 L 316 54 C 300 54 292 62 292 74 C 292 86 304 94 324 94 L 368 94 C 392 94 404 108 404 124 C 404 140 388 140 368 140 L 278 140 L 278 124 L 364 124 C 376 124 380 120 380 114 C 380 108 372 106 356 106 L 312 106 C 284 106 270 94 270 74 C 270 48 282 38 308 38 Z" fill="url(#gpsLimeGrad)" stroke="#1c3302" stroke-width="3.5" stroke-linejoin="round" />
