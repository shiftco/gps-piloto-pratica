  <g transform="translate(378, 12)" filter="url(#pinShadow)">
    <path d="M 28 0 C 12.5 0 0 12.5 0 28 C 0 46 25 72 28 75 C 31 72 56 46 56 28 C 56 12.5 43.5 0 28 0 Z" fill="url(#pinRedGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="28" cy="27" r="12.5" fill="#3b0707" stroke="#991b1b" stroke-width="2" />
    <path d="M 12 14 C 16 8 23 4 30 4 C 34 4 38 5 42 8 C 36 6 28 6 22 9 C 16 12 12 18 10 24 C 10 20 11 16 12 14 Z" fill="#ffffff" opacity="0.75" />
    <circle cx="20" cy="18" r="2.5" fill="#ffffff" opacity="0.8" />
