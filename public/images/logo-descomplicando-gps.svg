    <path d="M 120 10 L 55 10 C 22 10 10 32 10 65 L 10 85 C 10 120 25 140 60 140 L 118 140 C 126 140 130 135 130 125 L 130 92 L 78 92 L 78 108 L 108 108 L 108 122 L 62 122 C 42 122 34 110 34 85 L 34 65 C 34 40 42 28 62 28 L 120 28 Z" fill="#182e02" transform="translate(4, 6)" />
