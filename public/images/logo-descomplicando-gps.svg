<svg viewBox="0 0 540 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gpsLimeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4f738" />
      <stop offset="25%" stop-color="#9ee312" />
      <stop offset="70%" stop-color="#76be08" />
      <stop offset="100%" stop-color="#4f8502" />
    </linearGradient>
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="pinRedGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="85%" stop-color="#990000" />
      <stop offset="100%" stop-color="#550000" />
    </radialGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <linearGradient id="whiteMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- TOP TEXT: DESCOMPLICANDO -->
  <g transform="translate(10, 48) skewX(-14)">
    <text x="32" y="26" font-family="'Space Grotesk', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#090d0b" stroke="#090d0b" stroke-width="8" stroke-linejoin="round">DESCOMPLICANDO</text>
    <text x="32" y="26" font-family="'Space Grotesk', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="url(#whiteMetallic)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round">DESCOMPLICANDO</text>
  </g>

